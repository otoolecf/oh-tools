<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oh! Tools — Free browser tools</title>
    <meta
      name="keywords"
      content="online tools, JSON formatter, image editor, QR code generator, hash generator, UUID generator, barcode generator, diff tool, free tools, browser tools, privacy tools"
    />
    <meta name="author" content="Oh! Tools" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://oh-tools.net/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oh-tools.net/" />
    <meta property="og:image" content="https://oh-tools.net/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://oh-tools.net/" />
    <meta
      property="twitter:image"
      content="https://oh-tools.net/og-image.png"
    />
    <link rel="stylesheet" href="global.css" />
    <style>
      .tools-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        margin-top: 2rem;
        justify-content: center;
        max-width: 1000px;
        margin-left: auto;
        margin-right: auto;
      }

      .tool-card {
        flex: 0 1 calc((100% - 4rem) / 3);
        min-width: 0;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 1.5rem;
        transition: transform 0.2s, box-shadow 0.2s;
        display: flex;
        flex-direction: column;
        min-height: 200px;
      }

      @media (max-width: 1011px) {
        .tool-card { flex-basis: calc((100% - 2rem) / 2); }
      }

      @media (max-width: 679px) {
        .tool-card { flex-basis: 100%; }
      }

      .tool-card:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .tool-card h2 {
        margin: 0 1rem 0.5rem 1rem;
        color: var(--primary-color);
        text-align: left;
      }

      .tool-card p {
        color: var(--text-secondary);
        margin: 0 1rem 1rem 1rem;
        line-height: 1.6;
        flex-grow: 1;
        text-align: left;
      }

      .tool-link {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        min-height: var(--tool-link-height, 4rem);
        line-height: 1.5;
        padding: 0.5rem 1rem;
        background: var(--button-bg);
        color: var(--button-text);
        text-decoration: none;
        border-radius: 4px;
        transition: background-color 0.2s;
        font-weight: 500;
        margin: auto 1rem 0 1rem;
        text-align: center;
      }

      .tool-link-label { width: 100%; }

      .tool-link:hover,
      .tool-link:focus-visible {
        background: var(--button-hover);
        color: var(--button-text);
        text-decoration: none;
      }

      .tool-link:visited {
        color: var(--button-text);
      }

      .home-hero {
        text-align: center;
        padding: 3rem 0;
      }

      .home-hero h1 {
        margin: 0 auto 1.5rem auto;
        font-size: 2.8rem;
        color: var(--primary-color);
        display: flex;
        flex-direction: column;
        line-height: 1.2;
        align-items: flex-start;
        max-width: 600px;
        width: 100%;
      }

      .hero-tagline {
        font-size: 1.0rem;
        font-weight: 400;
        color: var(--text-secondary);
        margin-top: 0.5rem;
        line-height: 1.5;
        font-style: normal;
      }

      .home-hero p {
        font-size: 1.2rem;
        line-height: 1.7;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto;
        text-align: justify;
      }

      .home-hero p + p {
        margin-top: 1.25rem;
      }

    </style>
    <meta name="description" content="Edit images, trim videos, fix JSON, compare text, and more. Free browser tools that process files locally." />
    <meta property="og:title" content="Oh! Tools — Free browser tools" />
    <meta property="og:description" content="Edit images, trim videos, fix JSON, compare text, and more. Free browser tools that process files locally." />
    <meta name="twitter:title" content="Oh! Tools — Free browser tools" />
    <meta name="twitter:description" content="Edit images, trim videos, fix JSON, compare text, and more. Free browser tools that process files locally." />
  </head>
  <body>
    <otoolebox-header current-path="/"></otoolebox-header>

    <div class="container">
      <div class="home-hero">
        <h1>
          <!-- site-wordmark -->
          <span class="hero-tagline">Handy tools for everyday annoyances.</span>
        </h1>
        <p>Free tools for the small jobs that shouldn’t need a whole new app. Edit images,
          trim videos, fix JSON, and get back to what you were doing.</p>
        <p>Files are processed in your browser. Browser Bridge lets you choose what
          to share with another device.</p>
      </div>

      <main>
        <div class="tools-grid" id="toolsGrid">
          <!-- Tool cards are generated from tools.json during the build. -->
        </div>
      </main>

      <otoolebox-footer></otoolebox-footer>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
