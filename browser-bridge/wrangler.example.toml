# Copy to the ignored wrangler.toml. Choose your own Worker name before deploying.
name = "oh-tools-signaling"
main = "cloudflare-worker.js"
compatibility_date = "2026-10-30"

[[durable_objects.bindings]]
name = "SIGNALING_INBOXES"
class_name = "SignalingInbox"

[[migrations]]
tag = "inboxes-v1"
new_sqlite_classes = ["SignalingInbox"]

# Required. This identifier selects a limiter namespace; it is not a secret.
# Use a distinct number for another service in the same account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Optional custom-domain route, configured only after validating your deployment.
# route = "signaling.example.com/*"
