<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID Generator - Generate Unique Identifiers</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <otoolebox-header current-tool="UUID Generator" base-path="../"></otoolebox-header>
    
    <div class="container">
        <tool-hero data-tool-path="/uuid-generator/"></tool-hero>
        
        <main class="tool-container">
            
            <!-- Generator Controls -->
            <div class="section-card">
                <div class="generator-controls">
                    <div class="control-group">
                        <label for="uuidCount">Number of UUIDs:</label>
                        <input type="number" id="uuidCount" min="1" max="100" value="1" class="number-input">
                    </div>
                    <div class="control-group">
                        <label for="uuidFormat">Format:</label>
                        <select id="uuidFormat" class="select-input">
                            <option value="default">Default (lowercase with dashes)</option>
                            <option value="uppercase">Uppercase with dashes</option>
                            <option value="nodashes">No dashes (lowercase)</option>
                            <option value="nodashes-upper">No dashes (uppercase)</option>
                        </select>
                    </div>
                    <button id="generateBtn" class="btn-enhanced">Generate UUIDs</button>
                </div>
            </div>

            <!-- Generated UUIDs -->
            <div class="section-card">
                <div class="editor-header">
                    <h3>Generated UUIDs</h3>
                    <div class="header-buttons">
                        <button id="copyAllBtn" class="btn-copy" style="display: none;">Copy All</button>
                        <button id="clearBtn" class="btn-copy" style="display: none;">Clear</button>
                    </div>
                </div>
                <div class="uuid-results" id="uuidResults">
                    <div class="placeholder-message">
                        Click "Generate UUIDs" to create unique identifiers
                    </div>
                </div>
            </div>

        </main>
        
        <otoolebox-footer base-path="../"></otoolebox-footer>
    </div>
    
    <script src="script.js"></script>
    <!-- Load web components -->
    <script src="../components/otoolebox-header.js"></script>
    <script src="../components/otoolebox-footer.js"></script>
    <script src="../components/tool-hero.js"></script>
    <script src="../components/tool-data-loader.js"></script>
</body>
</html>
