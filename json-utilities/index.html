<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Utilities - Clean, Format, Validate & Diff</title>
    <link rel="stylesheet" href="../global.css?v=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <otoolebox-header current-tool="JSON Utilities" base-path="../"></otoolebox-header>

    <div class="container">
      <tool-hero data-tool-path="/json-utilities/"></tool-hero>

      <main class="tool-container">
        <!-- Action Buttons -->
        <div class="section-card">
          <div class="button-grid">
            <button id="validateBtn" class="btn-enhanced">Validate</button>
            <button id="cleanBtn" class="btn-enhanced">Clean</button>
            <button id="formatBtn" class="btn-enhanced">Format</button>
          </div>
        </div>

        <!-- JSON Editor -->
        <div class="section-card">
          <div class="editor-header">
            <h3>JSON Editor</h3>
            <div class="editor-buttons">
              <button id="undoBtn" class="btn-copy" style="display: none">
                Undo
              </button>
              <button id="copyBtn" class="btn-copy">Copy</button>
            </div>
          </div>
          <div class="editor-wrapper">
            <textarea
              id="jsonEditor"
              class="json-textarea"
              placeholder="Paste your JSON here..."
              rows="20"
            ></textarea>
            <div id="errorMarker" class="error-marker" style="display: none">
              <span class="error-arrow">▶</span>
              <span class="error-line-num"></span>
            </div>
          </div>
        </div>

        <!-- Results & Messages -->
        <div
          id="messageContainer"
          class="message-container"
          style="display: none"
        >
          <div id="messageContent" class="message-content"></div>
        </div>
      </main>

      <otoolebox-footer base-path="../"></otoolebox-footer>
    </div>

    <!-- External Libraries -->
    <script src="node_modules/jsonrepair/lib/umd/jsonrepair.js"></script>
    <script src="node_modules/json5/dist/index.min.js"></script>

    <script src="script.js?v=1"></script>
    
    <!-- Load web components -->
    <script src="../components/otoolebox-header.js"></script>
    <script src="../components/otoolebox-footer.js"></script>
    <script src="../components/tool-hero.js"></script>
    <script src="../components/tool-data-loader.js"></script>
  </body>
</html>
