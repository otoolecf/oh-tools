<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Formatter, Validator &amp; Repair — Oh! Tools</title>
    <meta name="keywords" content="JSON formatter, JSON validator, JSON cleaner, JSON prettify, fix JSON, JSON repair, online JSON tool" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://oh-tools.net/json-utilities/" />
    
    <!-- Open Graph -->
    <meta property="og:url" content="https://oh-tools.net/json-utilities/" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="description" content="Repair malformed JSON, clean up formatting, and check for errors in your browser." />
    <meta property="og:title" content="JSON Formatter, Validator &amp; Repair — Oh! Tools" />
    <meta property="og:description" content="Repair malformed JSON, clean up formatting, and check for errors in your browser." />
    <meta name="twitter:title" content="JSON Formatter, Validator &amp; Repair — Oh! Tools" />
    <meta name="twitter:description" content="Repair malformed JSON, clean up formatting, and check for errors in your browser." />
  </head>
  <body>
    <otoolebox-header current-tool="JSON Utilities" base-path="../"></otoolebox-header>

    <div class="container">
      <tool-hero data-tool-path="/json-utilities/"></tool-hero>

      <main class="tool-container">
        <!-- Action Buttons -->
        <div class="section-card">
          <div class="button-grid">
            <button id="validateBtn" class="btn-enhanced">Validate</button>
            <button id="cleanBtn" class="btn-enhanced">Clean</button>
            <button id="formatBtn" class="btn-enhanced">Format</button>
          </div>
        </div>

        <!-- JSON Editor -->
        <div class="section-card">
          <div class="editor-header">
            <h3>JSON Editor</h3>
            <div class="editor-buttons">
              <button id="undoBtn" class="btn-copy" style="display: none">
                Undo
              </button>
              <button id="copyBtn" class="btn-copy">Copy</button>
            </div>
          </div>
          <div class="editor-wrapper">
            <textarea
              id="jsonEditor"
              class="json-textarea"
              placeholder="Paste your JSON here."
              rows="20"
            ></textarea>
            <div id="errorMarker" class="error-marker" style="display: none">
              <span class="error-arrow">▶</span>
              <span class="error-line-num"></span>
            </div>
          </div>
        </div>

        <!-- Results & Messages -->
        <div
          id="messageContainer"
          class="message-container"
          style="display: none"
        >
          <div id="messageContent" class="message-content"></div>
        </div>
      </main>

      <otoolebox-footer base-path="../"></otoolebox-footer>
    </div>

    <!-- External Libraries -->
    <script type="module" src="./main.js"></script>
</body>
</html>
