<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passphrase Generator - Generate Secure and Memorable Passphrases</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="styles.css">
    <script src="passhelp.min.js"></script>
    <script>
        // Check if passhelp loaded successfully
        if (typeof passhelp !== 'undefined') {
            console.log('passhelp loaded successfully');
            window.dispatchEvent(new CustomEvent('passhelpReady'));
        } else {
            console.error('Failed to load passhelp');
            window.dispatchEvent(new CustomEvent('passhelpFailed'));
        }
    </script>
</head>
<body>
    <otoolebox-header current-tool="Passphrase Generator" base-path="../"></otoolebox-header>
    
    <div class="container">
        <tool-hero data-tool-path="/passphrase-generator/"></tool-hero>
        
        <main class="tool-container">
            
            <!-- Passphrase Type Selection -->
            <div class="section-card">
                <h3>Passphrase Type</h3>
                <div class="passphrase-type-selection">
                    <label class="radio-option">
                        <input type="radio" name="passphraseType" value="human" id="humanType" checked>
                        <span class="radio-label">Human Memorable Natural Language</span>
                        <span class="radio-description">Easy to remember word combinations</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="passphraseType" value="secure" id="secureType">
                        <span class="radio-label">Secure Random</span>
                        <span class="radio-description">Cryptographically secure random strings</span>
                    </label>
                </div>
            </div>

            <!-- Human Readable Options -->
            <div class="section-card" id="humanOptions">
                <h3>Human Memorable Natural Language Options</h3>
                <div class="controls-grid">
                    <div class="control-group">
                        <label for="humanCount">Number of passphrases:</label>
                        <input type="number" id="humanCount" min="1" max="20" value="1" class="number-input">
                    </div>
                    <div class="control-group">
                        <label for="separator">Word separator:</label>
                        <select id="separator" class="select-input">
                            <option value="">None</option>
                            <option value="-">Dash (-)</option>
                            <option value="_">Underscore (_)</option>
                            <option value=" ">Space</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="caseOption">Word case:</label>
                        <select id="caseOption" class="select-input">
                            <option value="capitalize">Capitalize (BrightEagle)</option>
                            <option value="lowercase">Lowercase (brighteagle)</option>
                            <option value="uppercase">Uppercase (BRIGHTEAGLE)</option>
                        </select>
                    </div>
                    <div class="control-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="includeAdverb">
                            Include adverb (4 words total)
                        </label>
                    </div>
                </div>
                
                <div class="enhancement-options">
                    <h4>Enhancement Options</h4>
                    <div class="controls-grid">
                        <div class="control-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="addNumbers">
                                Add numbers (2-4 digits)
                            </label>
                        </div>
                        <div class="control-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="addSymbols">
                                Add special characters (!@#$%&*)
                            </label>
                        </div>
                        <div class="control-group">
                            <label for="enhancementPosition">Position:</label>
                            <select id="enhancementPosition" class="select-input" disabled>
                                <option value="sprinkle" selected>Sprinkle throughout</option>
                                <option value="beginning">Beginning</option>
                                <option value="middle">Middle</option>
                                <option value="end">End</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Secure Random Options -->
            <div class="section-card" id="secureOptions" style="display: none;">
                <h3>Secure Random Options</h3>
                <div class="controls-grid">
                    <div class="control-group">
                        <label for="secureCount">Number of passphrases:</label>
                        <input type="number" id="secureCount" min="1" max="20" value="1" class="number-input">
                    </div>
                    <div class="control-group">
                        <label for="passwordLength">Length:</label>
                        <input type="range" id="passwordLength" min="8" max="64" value="16" class="range-input">
                        <span id="lengthValue" class="range-value">16</span>
                    </div>
                </div>
                
                <div class="character-sets">
                    <h4>Character Sets</h4>
                    <div class="controls-grid">
                        <div class="control-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="includeUppercase" checked>
                                Uppercase letters (A-Z)
                            </label>
                        </div>
                        <div class="control-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="includeLowercase" checked>
                                Lowercase letters (a-z)
                            </label>
                        </div>
                        <div class="control-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="includeNumbers" checked>
                                Numbers (0-9)
                            </label>
                        </div>
                        <div class="control-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="includeSymbols">
                                Symbols (!@#$%^&*)
                            </label>
                        </div>
                        <div class="control-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="avoidAmbiguous">
                                Avoid ambiguous characters (0,O,l,1)
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Generate Button -->
            <div class="section-card">
                <button id="generateBtn" class="btn-enhanced">Generate Passphrases</button>
            </div>

            <!-- Results -->
            <div class="section-card">
                <div class="editor-header">
                    <h3>Generated Passphrases</h3>
                    <div class="header-buttons">
                        <button id="copyAllBtn" class="btn-copy" style="display: none;">Copy All</button>
                        <button id="clearBtn" class="btn-copy" style="display: none;">Clear</button>
                    </div>
                </div>
                <div class="passphrase-results" id="passphraseResults">
                    <div class="placeholder-message">
                        Select your options and click "Generate Passphrases" to create secure passphrases
                    </div>
                </div>
            </div>

        </main>
        
        <otoolebox-footer base-path="../"></otoolebox-footer>
    </div>
    
    <script src="script.js"></script>
    <!-- Load web components -->
    <script src="../components/otoolebox-header.js"></script>
    <script src="../components/otoolebox-footer.js"></script>
    <script src="../components/tool-hero.js"></script>
    <script src="../components/tool-data-loader.js"></script>
</body>
</html>
