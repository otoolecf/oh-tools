<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Generator - Create Checksums and Digests</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <otoolebox-header current-tool="Hash Generator" base-path="../"></otoolebox-header>
    
    <div class="container">
        <tool-hero data-tool-path="/hash-generator/"></tool-hero>
        
        <main class="tool-container">
            
            <!-- Input Section -->
            <div class="section-card">
                <div class="input-section">
                    <label for="inputText">Input Text:</label>
                    <textarea id="inputText" class="input-textarea" placeholder="Enter text to hash..." rows="6"></textarea>
                    <div class="input-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="treatAsHex">
                            Treat input as hexadecimal
                        </label>
                    </div>
                </div>
            </div>

            <!-- Algorithm Selection -->
            <div class="section-card">
                <div class="algorithm-section">
                    <div class="control-group">
                        <label for="algorithmSelect">Hash Algorithm:</label>
                        <select id="algorithmSelect" class="select-input">
                            <optgroup label="Common Algorithms">
                                <option value="SHA-256" selected>SHA-256 (256-bit, Recommended)</option>
                                <option value="SHA-512">SHA-512 (512-bit)</option>
                                <option value="SHA-1">SHA-1 (160-bit, Legacy)</option>
                                <option value="MD5">MD5 (128-bit, Legacy)</option>
                            </optgroup>
                            <optgroup label="SHA-2 Family">
                                <option value="SHA-384">SHA-384 (384-bit)</option>
                            </optgroup>
                            <optgroup label="SHA-3 Family">
                                <option value="SHA3-224">SHA3-224 (224-bit)</option>
                                <option value="SHA3-256">SHA3-256 (256-bit)</option>
                                <option value="SHA3-384">SHA3-384 (384-bit)</option>
                                <option value="SHA3-512">SHA3-512 (512-bit)</option>
                            </optgroup>
                            <optgroup label="Other Algorithms">
                                <option value="RIPEMD160">RIPEMD-160 (160-bit)</option>
                            </optgroup>
                            <optgroup label="HMAC Algorithms">
                                <option value="HMAC-SHA-256">HMAC-SHA-256 (with secret key)</option>
                                <option value="HMAC-SHA-512">HMAC-SHA-512 (with secret key)</option>
                                <option value="HMAC-SHA-1">HMAC-SHA-1 (with secret key)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="control-group" id="secretKeyGroup" style="display: none;">
                        <label for="secretKey">Secret Key:</label>
                        <input type="text" id="secretKey" class="input-field" placeholder="Enter secret key for HMAC...">
                        <div class="key-options">
                            <label class="checkbox-label">
                                <input type="checkbox" id="keyAsHex">
                                Treat key as hexadecimal
                            </label>
                        </div>
                    </div>
                    <div class="control-group" id="verifyHashGroup" style="display: none;">
                        <label for="expectedHash">Expected Hash (for verification):</label>
                        <input type="text" id="expectedHash" class="input-field" placeholder="Enter hash to verify against...">
                    </div>
                    <div class="control-group" id="modeGroup" style="display: none;">
                        <label>Mode:</label>
                        <div class="mode-options">
                            <label class="radio-label">
                                <input type="radio" name="mode" value="generate" id="generateMode" checked>
                                Generate Hash
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="mode" value="verify" id="verifyMode">
                                Verify Hash
                            </label>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button id="generateBtn" class="btn-enhanced">Generate Hash</button>
                        <button id="clearBtn" class="btn-enhanced secondary">Clear All</button>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="section-card" id="resultsSection" style="display: none;">
                <div class="results-header">
                    <h3>Generated Hash</h3>
                    <button id="copyBtn" class="btn-copy">Copy Hash</button>
                </div>
                <div class="results-container" id="resultsContainer">
                    <!-- Results will be populated here -->
                </div>
            </div>

        </main>
        
        <otoolebox-footer base-path="../"></otoolebox-footer>
    </div>
    
    <!-- Crypto-JS Library -->
    <script src="lib/crypto-js.js"></script>
    
    <script src="script.js"></script>
    
    <!-- Load web components -->
    <script src="../components/otoolebox-header.js"></script>
    <script src="../components/otoolebox-footer.js"></script>
    <script src="../components/tool-hero.js"></script>
    <script src="../components/tool-data-loader.js"></script>
</body>
</html>
