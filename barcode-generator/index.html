<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Generator</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <otoolebox-header current-tool="Barcode Generator" base-path="../"></otoolebox-header>
    
    <div class="container">
        <tool-hero data-tool-path="/barcode-generator/"></tool-hero>
        
        <main class="tool-container">
        
        <div class="section-card control-grid">
            <div class="control-group" style="grid-column: span 2;">
                <label for="barcodeData" class="label-uppercase">Data / URL:</label>
                <textarea id="barcodeData" placeholder="Enter barcode data, text, or URL" rows="3">123456789</textarea>
            </div>
            
            <div class="control-group">
                <label for="barcodeType" class="label-uppercase">Barcode Type:</label>
                <select id="barcodeType">
                    <option value="code128">Code 128</option>
                    <option value="code39">Code 39</option>
                    <option value="ean13">EAN-13</option>
                    <option value="ean8">EAN-8</option>
                    <option value="upca">UPC-A</option>
                    <option value="upce">UPC-E</option>
                    <option value="qrcode">QR Code</option>
                    <option value="datamatrix">Data Matrix</option>
                    <option value="pdf417">PDF417</option>
                    <option value="azteccode">Aztec Code</option>
                </select>
            </div>
            
            <div class="control-group">
                <label class="label-uppercase">Size:</label>
                <div class="size-controls">
                    <select id="sizeMode">
                        <option value="scale">Scale</option>
                        <option value="pixels">Pixels</option>
                    </select>
                    <div class="flex-group" id="scaleGroup">
                        <input type="range" id="scale" min="1" max="10" value="3" step="0.5" class="flex-1">
                        <input type="number" id="scaleNumber" min="1" max="10" value="3" step="0.5" class="w-20">
                    </div>
                    <div class="flex-group" id="pixelGroup" style="display: none;">
                        <input type="number" id="pixelSize" min="50" max="1000" value="200" placeholder="Width in pixels" class="flex-1">
                        <span class="text-sm">px</span>
                    </div>
                </div>
            </div>
            
            <div class="control-group">
                <label for="foregroundColor" class="label-uppercase">Foreground Color:</label>
                <div class="flex-group">
                    <input type="color" id="foregroundColor" value="#000000" class="w-60 flex-shrink-0">
                    <input type="text" id="foregroundColorText" value="#000000" placeholder="#000000 or rgb(0,0,0)" class="flex-1">
                </div>
            </div>
            
            <div class="control-group">
                <label for="backgroundColor" class="label-uppercase">Background Color:</label>
                <div class="flex-group">
                    <input type="color" id="backgroundColor" value="#ffffff" class="w-60 flex-shrink-0">
                    <input type="text" id="backgroundColorText" value="#ffffff" placeholder="#ffffff or rgb(255,255,255)" class="flex-1">
                </div>
            </div>
            
            <div class="control-group">
                <label for="backgroundOpacity" class="label-uppercase">Background Opacity:</label>
                <div class="flex-group">
                    <input type="range" id="backgroundOpacity" min="0" max="100" value="100" class="flex-1">
                    <input type="number" id="opacityNumber" min="0" max="100" value="100" class="w-20">
                    <span class="text-sm">%</span>
                </div>
            </div>
            
            <div class="control-group">
                <label class="label-uppercase">Canvas Size:</label>
                <div class="canvas-size-controls">
                    <select id="canvasSizeMode">
                        <option value="auto">Auto (fit barcode)</option>
                        <option value="custom">Custom dimensions</option>
                    </select>
                    <div class="custom-size-group flex-group-vertical" id="customSizeGroup" style="display: none;">
                        <div class="flex-group">
                            <label for="canvasWidth" class="font-normal text-sm min-w-25">Width:</label>
                            <input type="number" id="canvasWidth" min="100" max="2000" value="400" placeholder="Width" class="flex-1 min-w-20">
                            <span class="text-sm">px</span>
                        </div>
                        <div class="flex-group">
                            <label for="canvasHeight" class="font-normal text-sm min-w-25">Height:</label>
                            <input type="number" id="canvasHeight" min="100" max="2000" value="600" placeholder="Height" class="flex-1 min-w-20">
                            <span class="text-sm">px</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <button id="generateBtn" class="btn btn-primary">Generate Barcode</button>
        </div>
        
        <div class="section-card text-center">
            <div id="canvasContainer">
                <canvas id="barcodeCanvas"></canvas>
            </div>
            
            <div class="export-controls">
                <h3>Save Barcode</h3>
                <div class="flex-group-center">
                    <select id="fileFormat" class="flex-shrink-0 min-w-25">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                        <option value="svg">SVG</option>
                    </select>
                    <button id="saveBtn" class="btn-enhanced">Save</button>
                </div>
            </div>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        </main>
        
        <otoolebox-footer base-path="../"></otoolebox-footer>
    </div>
    
    <script src="node_modules/bwip-js/dist/bwip-js-min.js"></script>
    <script src="script.js"></script>
    <!-- Load web components -->
    <script src="../components/otoolebox-header.js"></script>
    <script src="../components/otoolebox-footer.js"></script>
    <script src="../components/tool-hero.js"></script>
    <script src="../components/tool-data-loader.js"></script>
</body>
</html>
